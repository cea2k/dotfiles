config_version = 15

[bar.default]
background_opacity = 0.79999998211860657
border = "primary"
capsule_radius = 6
center = [ "bar", "clock", "weather", "control-center", "radio", "media" ]
end = [ "notifications", "tray", "clipboard", "network", "bluetooth", "volume", "battery", "brightness", "session" ]
font_family = "Liberation Mono"
font_scale = 1.1999999806284904
font_weight = 300
margin_ends = 0
radius = 0
radius_top_left = 0
scale = 1.1000000089406967
start = [ "workspaces", "launcher", "wallhaven", "wallpaper", "screenshot", "widget" ]
thickness = 40

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 409.77618408203125
    cy = 344.92337036132812
    output = "eDP-1"
    placement_height = 1227.0
    placement_width = 1963.0
    rotation = -0.0
    type = "calendar"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = true
        background_opacity = 0.75
        show_week_numbers = true

[dock]
border_width = 1.0
enabled = true
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
address = "Recoleta, Santiago, Chile"

