[plugins]
enabled = [
    "noctalia/wallhaven",
    "noctalia/translator",
    "nilsonlinux/world-radio",
    "strob3/dnf-updater",
    "nilsonlinux/speedtest-meter",
    "noctalia/world_clock",
    "alexander/screen-toolkit"
]

[shell]
font_family = "Liberation Mono"
panel_anchor_bar = "default"

[theme]
builtin = "Catppuccin"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[wallpaper.default]
path = "/home/cealarcon/Pictures/wallhaven-vpdpom.jpg"

[wallpaper.last]
path = "/home/cealarcon/Pictures/wallhaven-vpdpom.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/cealarcon/Pictures/wallhaven-vpdpom.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/cealarcon/Pictures/wallhaven-vpdpom.jpg"

[weather]
refresh_minutes = 60

[widget.bar]
type = "noctalia/world_clock:bar"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M} {:%D}"
timezone = "America/Santiago"

[widget.media]
hide_when_idle = true

[widget.network]
show_label = false

[widget.radio]
type = "nilsonlinux/world-radio:radio"

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
show_condition = false

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
active_pill_size = 4.0
hide_when_empty = true
label_source = "name"
max_label_chars = 6