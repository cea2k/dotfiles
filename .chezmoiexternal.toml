# Third-party files chezmoi downloads and keeps updated (refreshed weekly on apply)

[".local/bin/fzf-preview.sh"]
type = "file"
url = "https://raw.githubusercontent.com/junegunn/fzf/master/bin/fzf-preview.sh"
executable = true
refreshPeriod = "168h"

[".tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm"
refreshPeriod = "168h"